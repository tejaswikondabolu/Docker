
name: Replace Repository From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/project
          unzip -q docker.zip -d /tmp/project

          PROJECT_DIR=$(find /tmp/project -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Project folder not found!"
            exit 1
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          cp -a "$PROJECT_DIR"/. .

          rm -f docker.zip

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Replace repository with AI Auditor project"
          git push
